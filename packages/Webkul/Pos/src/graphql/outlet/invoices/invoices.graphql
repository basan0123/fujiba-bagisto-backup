#outlet\invoices — qualified-invoice (適格請求書) APIs for POS
extend type Query @guard(with: ["pos_user"]) {
    getQualifiedInvoices(
        first: Int,
        page: Int,
        # legacy: paid|pending — still honoured (maps to payment filter)
        filter: String,
        # document status: draft | created | shipped
        status: String,
        # payment status: unpaid | partial | paid
        payment: String,
        dateFrom: String,
        dateTo: String,
        customer: String,
        # owner-only: include every outlet's invoices
        allOutlets: Boolean,
        orderId: Int
    ): [QualifiedInvoice!] @paginate(
        type: "PAGINATOR",
        builder: "Webkul\\Pos\\Queries\\Invoice\\InvoiceQuery@listInvoices",
        defaultCount: 25
    )

    getQualifiedInvoice(id: ID!): QualifiedInvoice
        @field(resolver: "Webkul\\Pos\\Queries\\Invoice\\InvoiceQuery@getInvoice")

    # Summary numbers (counts per bucket, revenue, profit) for the same
    # filter the list uses. profit/cost are null for cashiers.
    getInvoiceStats(filter: InvoiceFilterInput): InvoiceStats
        @field(resolver: "Webkul\\Pos\\Queries\\Invoice\\InvoiceQuery@getStats")

    # Orders with items still to invoice — powers the "+ create invoice"
    # picker. Returns a flat list (no pagination — capped at limit) so
    # the picker can render instantly.
    getInvoiceableOrders(limit: Int): [InvoiceableOrder!]!
        @field(resolver: "Webkul\\Pos\\Queries\\Invoice\\InvoiceQuery@listInvoiceableOrders")
}

input InvoiceFilterInput {
    status: String
    payment: String
    dateFrom: String
    dateTo: String
    customer: String
    allOutlets: Boolean
    orderId: Int
}

input InvoiceDraftItemInput {
    product_id: Int!
    quantity: Int!
    custom_price: Float
    selected_configurable_option: Int
    additional: String
}

type InvoiceStatBucket {
    key: String!
    count: Int!
}

type InvoiceStats {
    totalCount: Int!
    revenue: Float!
    collected: Float!
    outstanding: Float!
    # null for cashiers (margin is owner/manager-only).
    profit: Float
    cost: Float
    canSeeProfit: Boolean!
    statusCounts: [InvoiceStatBucket!]!
    paymentCounts: [InvoiceStatBucket!]!
}

extend type Mutation @guard(with: ["pos_user"]) {
    sendQualifiedInvoiceEmail(
        invoiceId: ID!,
        toEmail: String
    ): QualifiedInvoiceActionResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@sendEmail")

    generateQualifiedInvoicePdf(
        invoiceId: ID!
    ): QualifiedInvoiceActionResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@generatePdf")

    # Create a new invoice from an order. Cashier+ gated. Invoices every
    # remaining qty_to_invoice line. Refuses if there's nothing left.
    generateInvoice(orderId: Int!): generateInvoiceResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@generate")

    # paid / pending / refunded. Cashier+ for paid/pending, manager+ for refunded.
    setOrderPaymentStatus(orderId: Int!, status: String!): orderStatusResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@setPaymentStatus")

    # pending / shipped / delivered. Cashier+ for all.
    setOrderShippingStatus(orderId: Int!, status: String!): orderStatusResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@setShippingStatus")

    # Standalone invoice builder: create a DRAFT order (no invoice/shipment).
    # generateInvoice advances draft→created; setOrderShippingStatus→shipped.
    createInvoiceDraft(
        idempotency_key: String,
        customer_id: Int,
        customer_first_name: String,
        customer_last_name: String,
        customer_email: String,
        customer_phone: String,
        order_discount_amount: Float,
        order_discount_reason: String,
        note: String,
        items: [InvoiceDraftItemInput!]!
    ): invoiceDraftResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceBuilderMutation@createDraft")

    # Record a (part-)payment. Derives unpaid/partial/paid and stamps paid_at
    # when fully settled. Cashier+.
    addInvoicePayment(
        invoiceId: ID!,
        amount: Float!,
        method: String,
        reference: String,
        note: String
    ): invoicePaymentResult
        @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\InvoiceMutation@addPayment")
}

type invoiceDraftResult {
    success: Boolean!
    message: String
    orderId: Int
    invoiceId: Int
}

type invoicePaymentResult {
    success: Boolean!
    message: String
    invoiceId: Int
    amountPaid: Float
    paymentStatus: String
}

type InvoiceableOrder {
    id: Int!
    incrementId: String
    grandTotal: Float!
    status: String
    createdAt: String
    customerName: String
    customerEmail: String
    qtyToInvoice: Int!
}

type generateInvoiceResult {
    success: Boolean!
    message: String
    invoiceId: Int
}

type orderStatusResult {
    success: Boolean!
    message: String
    orderId: Int
    status: String
}

type QualifiedInvoice {
    id: ID!
    incrementId: String
    orderId: Int
    orderIncrementId: String
    state: String
    # Coarse status derived server-side for the native status controls.
    paymentStatus: String   # 'unpaid' | 'partial' | 'paid' | 'refunded'
    documentStatus: String  # 'draft' | 'created' | 'shipped'
    shippingStatus: String  # 'pending' | 'shipped' | 'delivered'
    amountPaid: Float
    outstanding: Float
    payments: [InvoicePayment!]
    emailSent: Boolean
    createdAt: String
    grandTotal: Float
    subTotal: Float
    taxAmount: Float
    shippingAmount: Float
    discountAmount: Float
    currencyCode: String

    # Issuer (read from core_config_data + outlet)
    issuerName: String
    issuerAddress: String
    issuerPhone: String
    issuerRegistrationNumber: String

    # Recipient (from order's customer + billing address)
    recipientName: String
    recipientEmail: String
    recipientPhone: String
    recipientAddress: String

    items: [QualifiedInvoiceItem!]
    taxBreakdown: [QualifiedInvoiceTaxLine!]
}

type InvoicePayment {
    id: ID!
    amount: Float!
    method: String
    reference: String
    note: String
    paidAt: String
}

type QualifiedInvoiceItem {
    id: ID!
    sku: String
    name: String
    qty: Int
    price: Float
    taxPercent: Float
    taxAmount: Float
    total: Float
    totalInclTax: Float
}

# Grouped tax breakdown — required by Japan 適格請求書 (qualified invoice) rules.
# One row per distinct tax rate present in the invoice.
type QualifiedInvoiceTaxLine {
    ratePercent: Float
    baseAmount: Float
    taxAmount: Float
}

type QualifiedInvoiceActionResult {
    success: Boolean!
    message: String
    pdfUrl: String
}
