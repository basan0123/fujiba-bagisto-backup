#outlet\home\orders offline related APIs
extend type Mutation @guard(with: ["pos_user"]) {
    syncOrder (
        input: syncOrderInput! @spread
    ): syncOrderResponse @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\OrderMutation@syncOrder")
}

input syncOrderInput {
    idempotencyKey: String @rename(attribute: "idempotency_key")
    customerFirstName: String @rename(attribute: "customer_first_name")
    customerLastName: String @rename(attribute: "customer_last_name")
    customerEmail: String @rename(attribute: "customer_email")
    paymentMode: String @rename(attribute: "payment_mode")
    cashTotal: Float @rename(attribute: "cash_total")
    bankName: String @rename(attribute: "bank_name")
    cardDetails: String @rename(attribute: "card_details")
    orderNote: String @rename(attribute: "order_note")
    trainingMode: Boolean @rename(attribute: "training_mode")
    orderItems: [SyncOrderItemInput] @rename(attribute: "order_items")
    isReturned: Boolean @rename(attribute: "is_returned")
}

input SyncOrderItemInput {
    productId: Int! @rename(attribute: "product_id")
    customPrice: Float @rename(attribute: "custom_price")
    additional: String!
}

type syncOrderResponse {
    success: Boolean
    message: String
    outletOrder: OutletOrder @rename(attribute: "outlet_order")
}
