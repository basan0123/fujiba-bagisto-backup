# outlet/stock/manage.graphql — adjust + transfer (waste already lives
# in outlet/cashier/waste.graphql).

extend type Query @guard(with: ["pos_user"]) {
    # Global "allow sale when out of stock" flag
    # (catalog.inventory.stock_options.back_orders).
    getBackOrders: backOrdersResult @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\StockMutation@getBackOrders")
}

extend type Mutation @guard(with: ["pos_user"]) {
    stockAdjust(
        input: stockAdjustInput! @spread
    ): stockMutationResult @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\StockMutation@adjust")

    stockTransfer(
        input: stockTransferInput! @spread
    ): stockTransferResult @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\StockMutation@transfer")

    # Toggle the global out-of-stock-sale flag. Manager-only.
    setBackOrders(
        enabled: Boolean!
    ): backOrdersResult @field(resolver: "Webkul\\Pos\\Mutations\\Outlet\\StockMutation@setBackOrders")
}

type backOrdersResult {
    success: Boolean!
    enabled: Boolean!
    message: String
}

input stockAdjustInput {
    productId: Int!
    quantityDelta: Float!
    inventorySourceId: Int
    reason: String!
    note: String
    idempotencyKey: String
}

input stockTransferInput {
    productId: Int!
    fromInventorySourceId: Int!
    toInventorySourceId: Int!
    quantity: Float!
    note: String
    idempotencyKey: String
}

type stockMutationResult {
    success: Boolean!
    message: String
    qtyBefore: Float
    qtyAfter: Float
    auditRowId: Int
}

type stockTransferResult {
    success: Boolean!
    message: String
    fromQtyAfter: Float
    toQtyAfter: Float
    auditRowId: Int
}
