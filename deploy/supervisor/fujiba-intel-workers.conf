; PROPOSED - not installed. Install: copy to /etc/supervisor/conf.d/, then
;   supervisorctl reread && supervisorctl update   (does NOT restart bagisto-worker)
; Uses connection "redis-intel" (retry_after=1000, see config diff): default redis
; retry_after=90 is < job timeout, which would re-deliver running jobs.
; One worker per intel queue; nice 10 so the shop always wins CPU.
; --memory guards leaks; --max-time recycles hourly; --timeout > job $timeout (900).

[program:fujiba-intel-heavy]
command=nice -n 10 php /var/www/bagisto/artisan queue:work redis-intel --queue=intel-heavy --sleep=5 --tries=0 --timeout=960 --memory=512 --max-time=3600
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
startretries=999
startsecs=5
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/bagisto/storage/logs/worker-intel-heavy.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=1000

